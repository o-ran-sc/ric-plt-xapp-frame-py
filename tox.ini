[tox]
envlist = code,flake8,docs,docs-linkcheck
minversion = 4.0
skipsdist = true

[testenv:code]
basepython = python3.10
deps =
    pytest
    coverage
    pytest-cov
    six
    # Project runtime dependencies (mirrors setup.py install_requires) so
    # 'import' statements in tests/conftest.py and tests/*.py resolve in
    # the tox virtualenv without relying on the legacy Jenkins runner's
    # global site-packages. In particular tests/conftest.py imports
    # ricxappframe.entities.rnib.nb_identity_pb2 which transitively
    # imports google.protobuf and previously failed with:
    #
    #   ModuleNotFoundError: No module named 'google'
    inotify_simple
    msgpack
    mdclogpy
    ricsdl>=3.0.0,<4.0.0
    requests
    protobuf<3.21.0
    inotify
setenv =
    LD_LIBRARY_PATH = /usr/local/lib/:/usr/local/lib64
    RMR_SEED_RT = tests/fixtures/test_local.rt
    RMR_ASYNC_CONN = 0
commands =
    # add -s flag after pytest to show logs immediately instead of delaying
    pytest --cov ricxappframe --cov-report xml --cov-report term-missing --cov-report html --cov-fail-under=70 --junitxml=/tmp/tests.xml
    coverage xml -i

[testenv:flake8]
basepython = python3.10
skip_install = true
deps = flake8
commands = flake8 setup.py ricxappframe tests

[flake8]
# F824 ('nonlocal X is unused: name is never assigned in scope') was
# introduced in flake8 7.x / pyflakes 3.x. The legacy 'nonlocal CH /
# nonlocal EVENT' declarations in tests/test_sdl.py predate this check
# and are kept for readability; ignore F824 to preserve the existing
# legacy-code-tolerance pattern already used for E501/E741/E731.
extend-ignore = E501,E741,E731,F824
exclude = ricxappframe/entities,ricxappframe/subsclient

[testenv:clm]
# use pip to gather dependencies with versions for CLM analysis
whitelist_externals = sh
commands = sh -c 'pip freeze > requirements.txt'

# doc jobs
[testenv:docs]
basepython = python3
deps = -r{toxinidir}/docs/requirements-docs.txt
allowlist_externals = echo
commands =
    sphinx-build -W -b html -n -d {envtmpdir}/doctrees ./docs/ {toxinidir}/docs/_build/html
    echo "Generated docs available in {toxinidir}/docs/_build/html"

[testenv:docs-linkcheck]
basepython = python3
deps = -r{toxinidir}/docs/requirements-docs.txt
commands = sphinx-build -W -b linkcheck -d {envtmpdir}/doctrees ./docs/ {toxinidir}/docs/_build/linkcheck

